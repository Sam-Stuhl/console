# Reusable deploy workflow, called by every app repo.
#
# The real build+notify logic lives here once; each app repo has a thin
# caller (the deploy.yml starter the console hands out) that does
#   uses: sam-stuhl/console/.github/workflows/app-deploy.yml@main
# Fix a bug here and every app picks it up on its next push.
#
# The console repo, if private, must allow other sam-stuhl repos to call
# this: Settings -> Actions -> General -> Access -> "Accessible from
# repositories owned by sam-stuhl".
#
# No shared secrets: the app authenticates to the console with a GitHub
# OIDC token minted per run (audience=console). Cloudflare Access must
# Bypass the /hooks/* path so those self-authenticating calls get through.

name: app deploy

on:
  workflow_call:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint the OIDC token the console verifies
      packages: write # push the image to GHCR
      contents: read # checkout
    env:
      CONSOLE_URL: https://console.samstuhl.com
      # Bound here, never inlined into a run: script, so a crafted commit
      # message cannot inject shell.
      COMMIT_MSG: ${{ github.event.head_commit.message }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # First step in the job, before checkout, so the notify steps can
      # always reach the console: a build that dies at checkout still has
      # to report its failure.
      - name: Prepare the console token minter
        run: |
          cat > "$RUNNER_TEMP/console-token.sh" <<'EOF'
          # Sets CONSOLE_TOKEN. Call this in the same step that sends the
          # request, never once up front: a GitHub OIDC token lives for a
          # few minutes, so a token minted before the build has already
          # expired by the time a slow build finishes with it. That was a
          # real bug: the console rejected the notify, the run still went
          # green, and the deployment sat in "building" forever.
          mint_console_token() {
            local response
            response=$(curl -sS --fail-with-body \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=console") || return 1
            CONSOLE_TOKEN=$(printf '%s' "$response" | jq -r '.value')
            if [ -z "$CONSOLE_TOKEN" ] || [ "$CONSOLE_TOKEN" = "null" ]; then
              echo "::error::could not mint an OIDC token for the console"
              return 1
            fi
            echo "::add-mask::$CONSOLE_TOKEN"
          }
          EOF

      - uses: actions/checkout@v4

      - name: Compute image name
        # GHCR requires a lowercase path
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Notify build started
        # Best effort, so a console blip does not stop an image being built
        # and pushed: if this call is lost, /hooks/build-finished opens the
        # deployment row instead. Still worth shouting about, since whatever
        # rejected this will probably reject the finish notify too.
        run: |
          source "$RUNNER_TEMP/console-token.sh"
          started() {
            mint_console_token || return 1
            jq -n \
              --arg repo "$GITHUB_REPOSITORY" \
              --arg sha "$GITHUB_SHA" \
              --arg msg "$COMMIT_MSG" \
              --arg run "$RUN_URL" \
              '{repo: $repo, sha: $sha, commit_message: $msg, run_url: $run}' \
            | curl -sS --fail-with-body -X POST "$CONSOLE_URL/hooks/build-started" \
                -H "Authorization: Bearer $CONSOLE_TOKEN" \
                -H "Content-Type: application/json" \
                --data @-
          }
          started \
            || echo "::warning::console did not accept the build-started notification"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push
        id: build
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          # Honor app.dockerfile from console.toml (default ./Dockerfile)
          DOCKERFILE=$(python3 -c "import tomllib; print(tomllib.load(open('console.toml','rb')).get('app', {}).get('dockerfile', './Dockerfile'))")
          docker build -f "$DOCKERFILE" -t "$IMAGE:$SHORT_SHA" .
          docker push "$IMAGE:$SHORT_SHA"
          echo "TAGGED_IMAGE=$IMAGE:$SHORT_SHA" >> "$GITHUB_ENV"

      - name: Notify build finished (success)
        if: success()
        # --fail-with-body prints the console's rejection and exits nonzero,
        # so a notify the console refused turns the run red. A green run
        # here means the console really was told.
        run: |
          source "$RUNNER_TEMP/console-token.sh"
          mint_console_token
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --arg image "$TAGGED_IMAGE" \
            --arg toml "$(cat console.toml)" \
            --arg msg "$COMMIT_MSG" \
            --arg run "$RUN_URL" \
            '{repo: $repo, sha: $sha, conclusion: "success", image: $image, console_toml: $toml, commit_message: $msg, run_url: $run}' \
          | curl -sS --fail-with-body -X POST "$CONSOLE_URL/hooks/build-finished" \
              -H "Authorization: Bearer $CONSOLE_TOKEN" \
              -H "Content-Type: application/json" \
              --data @-

      - name: Notify build finished (failure)
        # Guarded on the build step rather than plain failure(): if the build
        # succeeded and only the success notify was refused, the image is
        # pushed and healthy, so reporting a failed build would be a lie. The
        # red run is the signal there; deploy the pushed tag by hand.
        if: failure() && steps.build.conclusion != 'success'
        run: |
          source "$RUNNER_TEMP/console-token.sh"
          mint_console_token
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --arg run "$RUN_URL" \
            '{repo: $repo, sha: $sha, conclusion: "failure", run_url: $run}' \
          | curl -sS --fail-with-body -X POST "$CONSOLE_URL/hooks/build-finished" \
              -H "Authorization: Bearer $CONSOLE_TOKEN" \
              -H "Content-Type: application/json" \
              --data @-
