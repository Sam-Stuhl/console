# A manual "Run workflow" button for ops on the box, from a phone or from `gh`.
# Runs on the same self-hosted runner as build.yml's deploy job.
#
# Why it exists: the SSH path (docs/remote-access.md) rides the cloudflared
# CONTAINER, so Docker down means tunnel down means no shell. The runner polls
# GitHub outbound, so it keeps working when Docker is unhealthy. Its real job is
# repin-console: rolling the console back to a known-good image when a bad one
# restart-loops it. That is what makes build.yml's "never locks you out, because
# remote docker can always re-pin the last good tag" actually true.
#
# How much start-engine can do depends on how your host starts things. If the
# runner and the container engine are managed the same way (both boot-time
# services, or both agents in the same session), the runner can usually revive a
# dead engine. If the engine needs a GUI session and the runner does not have
# one, it cannot. Either way it cannot help when the runner itself failed to
# start, so keep an access path that does not depend on this workflow or on
# Docker: see docs/remote-access.md.
#
# PUBLIC REPO, SO THE RUN LOGS ARE A PUBLIC WEB PAGE. Only accounts with write
# access can dispatch this, so nobody else can press it, but anyone can read what
# it printed. GitHub masks Actions secrets in logs; it cannot mask ours, because
# app secrets live encrypted in the console's DB and are injected as container
# env, so GitHub has never seen them and has nothing to match against. Hence:
# a fixed action menu instead of a free-form command box, and scalar-only output.
# `docker inspect -f '{{.State.Status}}' console` is fine. A bare `docker inspect`,
# `docker logs`, `docker ps`, or anything echoing an env var is NEVER acceptable
# here: one such line would publish the Neon DATABASE_URL permanently.

name: server ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do on the box
        type: choice
        required: true
        default: status
        options:
          - status
          - restart-console
          - repin-console
          - compose-up
          - start-engine
      tag:
        description: "repin-console only: image tag to pin, e.g. 1a2b3c4 (short sha from a build run)"
        required: false
        default: ""

# This job drives Docker on the box and never calls the GitHub API. The runner's
# clone pulls a public repo over https using its own git config, not this token.
permissions: {}

jobs:
  ops:
    runs-on: [self-hosted, console-host]
    steps:
      - name: Run ${{ inputs.action }}
        shell: bash
        # Inputs are passed as env, never interpolated into the script body.
        # `${{ inputs.tag }}` inline would let the tag field inject shell.
        env:
          ACTION: ${{ inputs.action }}
          TAG: ${{ inputs.tag }}
          DEPLOY_DIR: ${{ vars.CONSOLE_DEPLOY_DIR }}
          # Optional: the command that starts your container engine if it is
          # not a boot-time daemon (for example `colima start`). Leave the
          # ENGINE_START repo variable unset where docker starts itself.
          ENGINE_START: ${{ vars.CONSOLE_ENGINE_START }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_DIR:-}" ]; then
            echo "CONSOLE_DEPLOY_DIR repo variable is not set." >&2
            exit 1
          fi
          # Service managers often start runners with a minimal PATH that omits
          # wherever docker was installed. Add the usual prefixes if they exist.
          for p in /opt/homebrew/bin /usr/local/bin; do
            if [ -d "$p" ]; then PATH="$p:$PATH"; fi
          done
          export PATH
          cd "$DEPLOY_DIR"

          case "$ACTION" in

            status)
              # Nothing to do: the scalar status below is the whole point.
              ;;

            restart-console)
              docker restart console
              ;;

            repin-console)
              if [ -z "$TAG" ]; then
                echo "repin-console needs a tag. Take a short sha from a green 'build console image' run." >&2
                exit 1
              fi
              case "$TAG" in
                *[!A-Za-z0-9._-]*)
                  echo "that tag is not a valid image tag." >&2
                  exit 1
                  ;;
              esac
              # compose.prod.yaml reads ${CONSOLE_IMAGE:-...:latest}. This pin lasts
              # only for this step, so the next push to main puts the console back on
              # :latest. It is how you get the console back, not a state change: fix
              # forward or revert the commit afterwards.
              # Derived from the repo, not hardcoded. Lowercased with tr rather
              # than ${VAR,,} because macOS still ships bash 3.2.
              repo=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
              CONSOLE_IMAGE="ghcr.io/$repo:$TAG" \
                docker compose -f compose.prod.yaml up -d console
              ;;

            compose-up)
              git pull --ff-only
              docker compose -f compose.prod.yaml up -d
              ;;

            start-engine)
              if [ -z "${ENGINE_START:-}" ]; then
                echo "CONSOLE_ENGINE_START repo variable is not set, so there is" >&2
                echo "no command to run. Set it if your engine needs starting." >&2
                exit 1
              fi
              sh -c "$ENGINE_START"
              echo "ran the engine start command; waiting up to 120s for it"
              deadline=$(( $(date +%s) + 120 ))
              until docker info >/dev/null 2>&1; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "engine still not answering after 120s" >&2
                  exit 1
                fi
                sleep 5
              done
              ;;
          esac

          # Scalar only. See the header before adding anything to this.
          state=$(docker inspect -f '{{.State.Status}}' console 2>/dev/null || true)
          [ -n "$state" ] || state="absent (or the engine is not answering)"
          echo "console: $state"
