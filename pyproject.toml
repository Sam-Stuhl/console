[project]
name = "console"
version = "0.1.0"
description = "Single-tenant self-hosted PaaS control plane"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "docker",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "alembic",
    "cryptography",
    "pydantic",
    "pyjwt[crypto]",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/console"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
