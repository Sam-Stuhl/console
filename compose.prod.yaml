# Production base infrastructure for the home server. Brings up the router
# (Traefik), the console, and the Cloudflare tunnel. App containers are
# started separately by the console's deploy engine and join the same
# external `web` network, where Traefik discovers them by label.
#
# Runs on the Windows PC under Docker Desktop (WSL2 backend, Linux
# containers). Nothing is published to the host: the only way in is the
# Cloudflare tunnel, which reaches Traefik over the docker network.
#
# Before `up`:
#   docker network create web
#   put the Fernet key at ./secrets/console_key
#   put TUNNEL_TOKEN=... in a .env file next to this file
# See docs/server-setup.md for the full runbook.

name: console

services:
  traefik:
    # v3.6+ required: Docker engine 29 dropped API versions older than 1.40.
    image: traefik:v3.6
    container_name: traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      # Keep cloudflared's X-Forwarded-Proto instead of overwriting it with the
      # scheme of the hop into Traefik, which is always plain http. Without
      # this every app behind here believes its requests arrived over http:
      # absolute URLs it builds come out http:// on an https site (this is what
      # made GitHub refuse the console's OAuth redirect), and cookies marked
      # secure-if-https never are.
      #
      # "insecure" means Traefik trusts these headers from whoever connects to
      # it. Here that is only cloudflared and our own app containers, because
      # Traefik publishes no ports to the host and the tunnel is the only way
      # in. The alternative, trustedIPs, would pin a docker-assigned address
      # that changes.
      - --entrypoints.web.forwardedHeaders.insecure=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [web]
    restart: unless-stopped

  console:
    # The upstream published image, on purpose: a fresh install should come up
    # without forking or building anything. This is the one place a specific
    # account is not a personalization to strip, it is where the project ships
    # from. Fork and run the build workflow and CI publishes under your own
    # account instead; point CONSOLE_IMAGE at that, or at an older tag to
    # roll back.
    image: ${CONSOLE_IMAGE:-ghcr.io/sam-stuhl/console:latest}
    container_name: console
    depends_on: [traefik]
    volumes:
      # The deploy engine drives Docker, so the console needs the socket
      # read-write (Traefik only reads it).
      - /var/run/docker.sock:/var/run/docker.sock
      # The SQLite DB (projects, secrets, deploy history) is a host bind-mount
      # so it survives image updates and is easy to carry to a new machine:
      # copy ./data plus ./secrets/console_key and you have the whole state.
      - ./data:/data
    secrets:
      - console_key
      # Uncomment to let the console manage Cloudflare Access (the per-app
      # login toggle). Needs ./secrets/cf_api_token (a token scoped to
      # Access: Apps and Policies -> Edit) and CF_ACCOUNT_ID in .env.
      # See docs/server-setup.md step 9.
      # - cf_api_token
    environment:
      CONSOLE_DOMAIN: ${CONSOLE_DOMAIN:?set CONSOLE_DOMAIN in .env (your base domain, e.g. example.com)}
      # The GitHub account allowed to deploy here. Unset rejects every webhook.
      CONSOLE_OIDC_OWNER: ${CONSOLE_OIDC_OWNER:?set CONSOLE_OIDC_OWNER in .env (your GitHub account name)}
      CONSOLE_OIDC_AUDIENCE: console
      # Optional. The GitHub connection's client id is normally saved in
      # Settings, in the browser; set it here instead if you would rather keep
      # it in the compose file. See docs/server-setup.md step 9.
      CONSOLE_GITHUB_CLIENT_ID: ${CONSOLE_GITHUB_CLIENT_ID:-}
      CONSOLE_KEY_FILE: /run/secrets/console_key
      CONSOLE_DB_PATH: /data/console.db
      # Blank unless set in .env: the access toggle then 503s and the rest
      # of the console is unaffected.
      CONSOLE_CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CONSOLE_CF_API_TOKEN_FILE: /run/secrets/cf_api_token
    labels:
      - traefik.enable=true
      - traefik.http.routers.console.rule=Host(`console.${CONSOLE_DOMAIN}`)
      - traefik.http.routers.console.entrypoints=web
      - traefik.http.services.console.loadbalancer.server.port=8000
    networks: [web]
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env (see docs/server-setup.md)}
    depends_on: [traefik]
    networks: [web]
    restart: unless-stopped

secrets:
  console_key:
    file: ./secrets/console_key
  # cf_api_token:
  #   file: ./secrets/cf_api_token

networks:
  web:
    external: true
